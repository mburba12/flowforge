services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: ${FLOWFORGE_POSTGRES_PASSWORD:-flowforge-local-only}
      POSTGRES_DB: flowforge
    ports: ["5433:5432"]
    volumes: ["flowforge_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0
    ports: ["10000:10000", "10001:10001"]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  flowforge_pg:
