[project]
name="flowforge"
version="1.0.0"
description="FlowForge complete Phase 1 platform foundation"
requires-python=">=3.12"
dependencies=["fastapi>=0.115","uvicorn[standard]>=0.30","sqlalchemy[asyncio]>=2.0","asyncpg>=0.29","greenlet>=3.0","alembic>=1.13","pydantic-settings>=2.4","email-validator>=2.2","pyjwt>=2.9","pwdlib[argon2]>=0.2","python-multipart>=0.0.9"]
[project.optional-dependencies]
dev=["pytest>=8.3","pytest-asyncio>=0.24","httpx>=0.27","ruff>=0.6","mypy>=1.11"]
[tool.pytest.ini_options]
pythonpath=["src"]
asyncio_mode="auto"
asyncio_default_fixture_loop_scope="function"
[tool.ruff]
extend-exclude = ["migrations/versions"]
line-length=100
[tool.ruff.lint]
select=["E","F","I","B","UP"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls=["fastapi.Depends"]
[tool.mypy]
python_version="3.12"
strict=true
