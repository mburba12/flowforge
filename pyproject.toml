[project]
name="flowforge"
version="1.0.0"
description="FlowForge complete Phase 1 platform foundation"
requires-python=">=3.12"
dependencies=["fastapi>=0.115","uvicorn[standard]>=0.30","sqlalchemy[asyncio]>=2.0","asyncpg>=0.29","greenlet>=3.0","alembic>=1.13","pydantic-settings>=2.4","email-validator>=2.2","pyjwt>=2.9","pwdlib[argon2]>=0.2","python-multipart>=0.0.9"]
[project.optional-dependencies]
dev=["pytest>=8.3","pytest-asyncio>=0.24","httpx>=0.27","ruff>=0.6","mypy>=1.11"]
[tool.pytest.ini_options]
pythonpath=["src"]
asyncio_mode="auto"
asyncio_default_fixture_loop_scope="function"
[tool.ruff]
extend-exclude = ["migrations/versions"]
line-length=100
[tool.ruff.lint]
select=["E","F","I","B","UP"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls=["fastapi.Depends"]
[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
warn_return_any = false
[tool.ruff.lint.per-file-ignores]
"src/flowforge/bg08_completion/router.py" = ["F403", "F405"]
"src/flowforge/bg08_final/router.py" = ["F403", "F405"]
"src/flowforge/bg08_final/service.py" = ["F403", "F405"]
"src/flowforge/commerce_completion/router.py" = ["F403", "F405"]
"src/flowforge/commerce_final/router.py" = ["F403", "F405"]
"src/flowforge/commerce_final/service.py" = ["F403", "F405"]
"src/flowforge/crm_completion/router.py" = ["F403", "F405"]
"src/flowforge/crm_completion/service.py" = ["F403", "F405"]
"src/flowforge/crm_final/router.py" = ["F403", "F405"]
"src/flowforge/crm_sales/router.py" = ["F403", "F405"]
"src/flowforge/crm_sales/service.py" = ["F403", "F405"]
"src/flowforge/finance_advanced/router.py" = ["F403", "F405"]
"src/flowforge/finance_advanced/service.py" = ["F403", "F405"]
"src/flowforge/finance_completion/router.py" = ["F403", "F405"]
"src/flowforge/finance_final/router.py" = ["F403", "F405"]
"src/flowforge/foundation_completion/router.py" = ["F403", "F405"]
"src/flowforge/foundation_completion/service.py" = ["F403", "F405"]
"src/flowforge/foundation_final/router.py" = ["F403", "F405"]
"src/flowforge/foundation_final/service.py" = ["F403", "F405"]
"src/flowforge/master_data/router.py" = ["F403", "F405"]
"src/flowforge/payroll_tax_completion/router.py" = ["F403", "F405"]
"src/flowforge/payroll_tax_completion/service.py" = ["F403", "F405"]
"src/flowforge/payroll_tax_final/router.py" = ["F403", "F405"]
"src/flowforge/payroll_tax_final/service.py" = ["F403", "F405"]
"src/flowforge/workforce_completion/router.py" = ["F403", "F405"]
"src/flowforge/workforce_completion/service.py" = ["F403", "F405"]
"src/flowforge/workforce_final/router.py" = ["F403", "F405"]
"src/flowforge/workforce_final/service.py" = ["F403", "F405"]
"src/flowforge/workforce_ultimate/router.py" = ["F403", "F405"]
"src/flowforge/workforce_ultimate/service.py" = ["F403", "F405"]
[[tool.mypy.overrides]]
module = [
    "flowforge.bg08_completion.*",
    "flowforge.bg08_final.*",
    "flowforge.bg09_final.*",
    "flowforge.bg10_final.*",
    "flowforge.bg11_final.*",
    "flowforge.bg13_ops.*",
    "flowforge.commerce_completion.*",
    "flowforge.commerce_final.*",
    "flowforge.crm_completion.*",
    "flowforge.crm_final.*",
    "flowforge.crm_sales.*",
    "flowforge.finance.*",
    "flowforge.finance_advanced.*",
    "flowforge.finance_completion.*",
    "flowforge.finance_final.*",
    "flowforge.finance_workflows.*",
    "flowforge.foundation_completion.*",
    "flowforge.foundation_final.*",
    "flowforge.master_data.*",
    "flowforge.payroll_tax_completion.*",
    "flowforge.payroll_tax_final.*",
    "flowforge.workforce_completion.*",
    "flowforge.workforce_final.*",
    "flowforge.workforce_ultimate.*"
]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
warn_return_any = false
