<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | Krov WorkAgent</title><style>:root{--bg:#07111f;--panel:#0d1b2e;--text:#edf5ff;--muted:#a9bad0;--brand:#57d3ff;--brand2:#8b7cff;--line:#243956;--bad:#ff8795}*{box-sizing:border-box}body{margin:0;font:16px/1.55 Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 85% 0,#172d55 0,transparent 34%),var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}.wrap{width:min(720px,calc(100% - 28px));margin:auto}.nav{border-bottom:1px solid var(--line)}.navin{height:70px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:1.2rem}.back{color:var(--muted)}main{padding:65px 0}.card{padding:28px;background:linear-gradient(145deg,var(--panel),#091728);border:1px solid var(--line);border-radius:18px}h1{font-size:clamp(2rem,6vw,3.8rem);line-height:1.05;margin:0 0 12px}.lead,.note{color:var(--muted)}label{display:block;font-weight:700;margin:15px 0 6px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#081526;color:var(--text);font:inherit}.btn{display:inline-flex;justify-content:center;width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#06101e;font-weight:900;cursor:pointer}.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.status{min-height:24px;margin-top:12px;color:var(--muted)}.error{color:var(--bad)}.choice{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice label{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0}.choice input{width:auto;margin-right:6px}@media(max-width:560px){.choice{grid-template-columns:1fr}}.krov-logo{display:block;width:auto;height:44px;max-width:min(310px,55vw);object-fit:contain}
@media(max-width:600px){.krov-logo{height:36px;max-width:52vw}}

.logo{display:flex!important;align-items:center!important;justify-content:flex-start!important;line-height:0!important;height:245px!important;padding:0!important;text-decoration:none!important;overflow:visible!important}
.krov-logo{display:block!important;width:auto!important;height:220px!important;max-width:min(1160px,94vw)!important;object-fit:contain!important;object-position:left center!important;margin:0!important;padding:0!important;transform:none!important}
.navin{display:flex!important;align-items:center!important}
@media(max-width:600px){.logo{height:168px!important}.krov-logo{height:150px!important;max-width:90vw!important}}

/* Vector logo (Krov WorkAgent): sized for the wide wordmark. */
.logo{height:auto!important;padding:12px 0!important;line-height:0!important}
.krov-logo{height:56px!important;width:auto!important;max-width:min(520px,78vw)!important}
@media(max-width:600px){.logo{height:auto!important}.krov-logo{height:40px!important;max-width:78vw!important}}
</style><link rel="icon" type="image/svg+xml" href="krov-mark.svg"></head><body><nav class="nav"><div class="wrap navin"><a class="logo" href="index.html"><img src="krov-workagent-logo.svg" alt="Krov WorkAgent" class="krov-logo"></a><a class="back" href="index.html">← Home</a></div></nav><main><div class="wrap"><section class="card"><h1>Create your Krov WorkAgent account</h1><p class="lead">Every feature included. You pay only for the storage and activity you use; moving your data in is free.</p><form id="form"><input type="hidden" id="plan" name="plan" value="usage"><label for="company">Organization</label><input id="company" name="company" required><label for="email">Administrator email</label><input id="email" name="email" type="email" autocomplete="email" required><button class="btn" type="submit">Continue</button><div class="status" id="status" aria-live="polite"></div></form><a class="btn secondary" href="index.html#pricing">See pricing</a></section></div></main><script>document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();if(!e.currentTarget.checkValidity()){e.currentTarget.reportValidity();return}const s=document.getElementById('status');s.className='status';s.textContent='Opening Krov WorkAgent...';const v=id=>document.getElementById(id).value.trim();const f=new URLSearchParams({plan:v('plan'),company:v('company'),email:v('email')});location.href=window.KROV_APP_URL+'/signup#'+f.toString()});</script><script src="krov-config.js"></script></body></html>
