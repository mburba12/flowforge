# FlowForge production stack (single authoritative runtime).
#
#   docker compose -p flowforge -f compose.production.yml --env-file .env.production up -d
#
# Use the scripts in scripts\production (Start/Stop/Status/Backup) rather than
# calling compose directly. docker-compose.yml remains the ISOLATED TEST stack
# used by the acceptance scripts; never point acceptance at this project.
#
# Required in .env.production (gitignored; created by Install-FlowForge.ps1):
#   FLOWFORGE_DB_OWNER_PASSWORD   database owner (migrations, backups, imports)
#   FLOWFORGE_APP_DB_PASSWORD     restricted runtime role flowforge_app (API)
#   FLOWFORGE_JWT_SECRET          token signing key
# Optional: FF_WEB_PORT (3000), FF_API_PORT (8000), FF_DB_PORT (5435); all bound to 127.0.0.1,
#   so only this computer reaches them directly. Other computers use the Cloudflare Tunnel.
# Optional connections: FLOWFORGE_CREDENTIALS_KEY, FLOWFORGE_PUBLIC_URL,
#   FLOWFORGE_PLAID_CLIENT_ID / _SECRET / _ENV, FLOWFORGE_GUSTO_CLIENT_ID / _CLIENT_SECRET / _ENV
# Optional public address (Set-FlowForgeTunnel.ps1): FLOWFORGE_TUNNEL_TOKEN and
#   COMPOSE_PROFILES=tunnel start the "tunnel" service (Cloudflare Tunnel -> web:3000).

name: flowforge

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge_owner
      POSTGRES_PASSWORD: ${FLOWFORGE_DB_OWNER_PASSWORD:?set in .env.production}
      FLOWFORGE_APP_DB_PASSWORD: ${FLOWFORGE_APP_DB_PASSWORD:?set in .env.production}
    volumes:
      - flowforge_pgdata:/var/lib/postgresql/data
      - ./infra/production/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${FF_DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge_owner -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migrate:
    build: .
    image: flowforge-api:local
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://flowforge_owner:${FLOWFORGE_DB_OWNER_PASSWORD}@db:5432/flowforge
      FLOWFORGE_DATABASE_URL: postgresql+asyncpg://flowforge_owner:${FLOWFORGE_DB_OWNER_PASSWORD}@db:5432/flowforge
      # Keys for `python -m flowforge.accounts.reencrypt` (moves stored values to the current key).
      FLOWFORGE_JWT_SECRET: ${FLOWFORGE_JWT_SECRET:?set in .env.production}
      FLOWFORGE_CREDENTIALS_KEY: ${FLOWFORGE_CREDENTIALS_KEY:-}
      FLOWFORGE_CREDENTIALS_KEY_PREVIOUS: ${FLOWFORGE_CREDENTIALS_KEY_PREVIOUS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: flowforge-api:local
    environment:
      FLOWFORGE_ENV: production
      FLOWFORGE_DATABASE_URL: postgresql+asyncpg://flowforge_app:${FLOWFORGE_APP_DB_PASSWORD}@db:5432/flowforge
      DATABASE_URL: postgresql+asyncpg://flowforge_app:${FLOWFORGE_APP_DB_PASSWORD}@db:5432/flowforge
      FLOWFORGE_JWT_SECRET: ${FLOWFORGE_JWT_SECRET:?set in .env.production}
      FLOWFORGE_ACCESS_TOKEN_MINUTES: "30"
      # Problem reports are queued here when support email is not configured.
      FLOWFORGE_SUPPORT_OUTBOX: /data/support-outbox
      # Connections (all optional; see docs\FLOWFORGE_PRODUCTION_RUNBOOK.md "Connections").
      # Without them: statement imports, payroll file imports and carrier tracking with
      # each business's own carrier keys all work; live bank feeds and direct Gusto
      # sign-in are switched off.
      FLOWFORGE_CREDENTIALS_KEY: ${FLOWFORGE_CREDENTIALS_KEY:-}
      FLOWFORGE_CREDENTIALS_KEY_PREVIOUS: ${FLOWFORGE_CREDENTIALS_KEY_PREVIOUS:-}
      # Account security (empty = production default: on; see src/flowforge/accounts/policy.py).
      FLOWFORGE_REQUIRE_OWNER_MFA: ${FLOWFORGE_REQUIRE_OWNER_MFA:-}
      FLOWFORGE_REQUIRE_VERIFIED_EMAIL: ${FLOWFORGE_REQUIRE_VERIFIED_EMAIL:-}
      FLOWFORGE_ALLOW_BOOTSTRAP: ${FLOWFORGE_ALLOW_BOOTSTRAP:-}
      FLOWFORGE_TURNSTILE_SITE_KEY: ${FLOWFORGE_TURNSTILE_SITE_KEY:-}
      FLOWFORGE_TURNSTILE_SECRET: ${FLOWFORGE_TURNSTILE_SECRET:-}
      FLOWFORGE_PUBLIC_URL: ${FLOWFORGE_PUBLIC_URL:-http://localhost:3000}
      FLOWFORGE_PLAID_CLIENT_ID: ${FLOWFORGE_PLAID_CLIENT_ID:-}
      FLOWFORGE_PLAID_SECRET: ${FLOWFORGE_PLAID_SECRET:-}
      FLOWFORGE_PLAID_ENV: ${FLOWFORGE_PLAID_ENV:-sandbox}
      FLOWFORGE_GUSTO_CLIENT_ID: ${FLOWFORGE_GUSTO_CLIENT_ID:-}
      FLOWFORGE_GUSTO_CLIENT_SECRET: ${FLOWFORGE_GUSTO_CLIENT_SECRET:-}
      FLOWFORGE_GUSTO_ENV: ${FLOWFORGE_GUSTO_ENV:-demo}
      # Public sign-in / sign-up attempt limits (rehearsals set off for the browser tests).
      FLOWFORGE_RATE_LIMITS: ${FLOWFORGE_RATE_LIMITS:-on}
      # Usage billing (docs\KROV_PRICING.md): invoices on the 1st, card charged 3 business
      # days later. Rates are your costs; prices add the margin and card fees.
      FLOWFORGE_BILLING: ${FLOWFORGE_BILLING:-on}
      FLOWFORGE_BILLING_EXEMPT: ${FLOWFORGE_BILLING_EXEMPT:-flowforge-production}
      FLOWFORGE_COST_STORAGE_GB_MONTH: ${FLOWFORGE_COST_STORAGE_GB_MONTH:-2.00}
      FLOWFORGE_COST_PER_1K_REQUESTS: ${FLOWFORGE_COST_PER_1K_REQUESTS:-0.0245}
      FLOWFORGE_TARGET_MARGIN: ${FLOWFORGE_TARGET_MARGIN:-0.70}
      FLOWFORGE_STRIPE_SECRET_KEY: ${FLOWFORGE_STRIPE_SECRET_KEY:-}
      FLOWFORGE_SMTP_HOST: ${FLOWFORGE_SMTP_HOST:-}
      FLOWFORGE_SMTP_PORT: ${FLOWFORGE_SMTP_PORT:-587}
      FLOWFORGE_SMTP_USERNAME: ${FLOWFORGE_SMTP_USERNAME:-}
      FLOWFORGE_SMTP_PASSWORD: ${FLOWFORGE_SMTP_PASSWORD:-}
      FLOWFORGE_MAIL_FROM: ${FLOWFORGE_MAIL_FROM:-}
      FLOWFORGE_MAIL_OUTBOX: /data/mail-outbox
    volumes:
      - flowforge_support:/data
    ports:
      - "127.0.0.1:${FF_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build: ./web
    image: flowforge-web:local
    environment:
      FLOWFORGE_API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${FF_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Public address through Cloudflare Tunnel (outbound only; no router ports opened).
  # Runs only with COMPOSE_PROFILES=tunnel; in the Cloudflare dashboard the tunnel's
  # public hostname points at http://web:3000. Never started by rehearsals.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${FLOWFORGE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    profiles: ["tunnel"]

  # Supporting services from the target architecture. The current API does not
  # call them yet; they are internal-only (no host ports) to avoid clashing with
  # other local stacks.
  redis:
    image: redis:7-alpine
    volumes:
      - flowforge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --location /data
    volumes:
      - flowforge_azurite:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped

volumes:
  flowforge_pgdata:
  flowforge_support:
  flowforge_redis:
  flowforge_azurite:
