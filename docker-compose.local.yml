services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: ${FLOWFORGE_POSTGRES_PASSWORD:-flowforge-local-only}
      POSTGRES_DB: flowforge
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["flowforge_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["flowforge_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0
    ports: ["127.0.0.1:10000:10000", "127.0.0.1:10001:10001"]
    volumes: ["flowforge_azurite:/data"]
  mailpit:
    image: axllent/mailpit
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  flowforge_postgres:
  flowforge_redis:
  flowforge_azurite:
